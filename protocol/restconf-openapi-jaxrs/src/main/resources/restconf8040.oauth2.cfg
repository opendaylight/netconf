# OpenAPI OAuth2/OIDC security scheme
# Authorization endpoint of the identity provider — authorizationCode + PKCE flow.
# Leave empty (default) to disable the OAuth2 scheme in the generated OpenAPI document.
oauth2-authorization-url=
# Token endpoint of the identity provider.
# Leave empty (default) to disable the OAuth2 scheme in the generated OpenAPI document.
oauth2-token-url=
# Refresh endpoint of the identity provider.
# Leave empty (default) to omit refreshUrl from the generated OpenAPI document.
oauth2-refresh-url=
# Scheme (http or https) used in the server URL of the generated OpenAPI document.
# Leave empty (default) to resolve it from the Forwarded or X-Forwarded-Proto header, or from the request.
openapi-scheme=
# URL of the online validator used by Swagger UI to validate the displayed OpenAPI document.
# Leave empty or set to "none" (default) to disable the validator, nothing is then sent to external services.
# Set to https://validator.swagger.io/validator to use the public Swagger validator.
swagger-ui-validator-url=none
