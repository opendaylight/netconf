services:
  netopeer2-server:
    image: sysrepo/sysrepo-netopeer2:latest
    # Fixed so tools/start_netopeer.sh can remove a container left by an
    # earlier run by name, without needing the compose file it was started
    # from, which lives in the directory that run provisions.
    container_name: pytest-netopeer2-server
    hostname: netopeer2
    network_mode: "host"
    command: sh -c "
      /root/init_configuration.sh &&
      exec netopeer2-server -d -v3"
    environment:
      - CALL_HOME_SERVER_IP=ODL_SYSTEM_IP
      - CALL_HOME_SSH_PORT=NETCONF_CH_SSH
      - CALL_HOME_TLS_PORT=NETCONF_CH_TLS
    volumes:
      # :z relabels each mount for SELinux, which otherwise denies the
      # container every path it is given and fails its start-up script.
      - ${NETOPEER_DIR:-/tmp/pytest-netopeer}/configuration-files:/root/configuration-files:z
      - ${NETOPEER_DIR:-/tmp/pytest-netopeer}/init_configuration.sh:/root/init_configuration.sh:z
      - ${NETOPEER_DIR:-/tmp/pytest-netopeer}/keyauth/sb-rsa-key.pub:/home/netconf/.ssh/authorized_keys:z
