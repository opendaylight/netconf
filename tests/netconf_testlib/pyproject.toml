[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odl-netconf-testlib"
version = "0.1.1"
description = "Reusable PyTest helper library for ODL NETCONF/RESTCONF CSIT test suites"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.14.3",
    "jmespath>=1.0.1",
    "paramiko>=4.0.0",
    "psutil>=7.1.0",
    "pydantic-settings>=2.11.0",
    "requests>=2.32.4",
]

[tool.setuptools.packages.find]
where = ["src"]
